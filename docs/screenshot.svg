<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <rect width="900" height="500" fill="#F0F2F6" rx="8"/>
  <rect x="20" y="20" width="200" height="460" fill="#FFFFFF" rx="6"/>
  <rect x="240" y="20" width="640" height="460" fill="#FFFFFF" rx="6"/>

  <!-- Sidebar -->
  <text x="40" y="55" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B2A4A">AEDM Dashboard</text>
  <rect x="35" y="75" width="170" height="30" fill="#F0F2F6" rx="4"/>
  <text x="50" y="95" font-family="sans-serif" font-size="12" fill="#666">Org Overview</text>
  <rect x="35" y="115" width="170" height="30" fill="#2EC4B6" rx="4"/>
  <text x="50" y="135" font-family="sans-serif" font-size="12" fill="#FFF">Exposure Heatmap</text>
  <rect x="35" y="155" width="170" height="30" fill="#F0F2F6" rx="4"/>
  <text x="50" y="175" font-family="sans-serif" font-size="12" fill="#666">Drift Analysis</text>
  <rect x="35" y="195" width="170" height="30" fill="#F0F2F6" rx="4"/>
  <text x="50" y="215" font-family="sans-serif" font-size="12" fill="#666">Demographics</text>
  <rect x="35" y="235" width="170" height="30" fill="#F0F2F6" rx="4"/>
  <text x="50" y="255" font-family="sans-serif" font-size="12" fill="#666">Reskilling Priority</text>

  <!-- Main content KPIs -->
  <rect x="265" y="45" width="140" height="70" fill="#F0F2F6" rx="6"/>
  <text x="335" y="75" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">Mean Exposure</text>
  <text x="335" y="100" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1B2A4A" text-anchor="middle">50.4%</text>

  <rect x="420" y="45" width="140" height="70" fill="#F0F2F6" rx="6"/>
  <text x="490" y="75" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">Roles Analyzed</text>
  <text x="490" y="100" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1B2A4A" text-anchor="middle">200</text>

  <rect x="575" y="45" width="140" height="70" fill="#F0F2F6" rx="6"/>
  <text x="645" y="75" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">Critical Roles</text>
  <text x="645" y="100" font-family="sans-serif" font-size="22" font-weight="bold" fill="#E63946" text-anchor="middle">47</text>

  <rect x="730" y="45" width="140" height="70" fill="#F0F2F6" rx="6"/>
  <text x="800" y="75" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">Depts Drifting</text>
  <text x="800" y="100" font-family="sans-serif" font-size="22" font-weight="bold" fill="#F4A261" text-anchor="middle">3</text>

  <!-- Chart placeholder -->
  <rect x="265" y="135" width="595" height="325" fill="#FAFBFC" rx="6" stroke="#E0E0E0" stroke-width="1"/>
  <text x="562" y="280" font-family="sans-serif" font-size="18" fill="#999" text-anchor="middle">AI Exposure by Department and Role</text>
  <!-- Mini heatmap cells -->
  <rect x="320" y="180" width="50" height="35" fill="#2EC4B6" rx="3" opacity="0.9"/>
  <rect x="375" y="180" width="50" height="35" fill="#2EC4B6" rx="3" opacity="0.6"/>
  <rect x="430" y="180" width="50" height="35" fill="#F4A261" rx="3" opacity="0.8"/>
  <rect x="485" y="180" width="50" height="35" fill="#E63946" rx="3" opacity="0.7"/>
  <rect x="540" y="180" width="50" height="35" fill="#2EC4B6" rx="3" opacity="0.4"/>
  <rect x="595" y="180" width="50" height="35" fill="#F4A261" rx="3" opacity="0.5"/>
  <rect x="650" y="180" width="50" height="35" fill="#E63946" rx="3" opacity="0.9"/>
  <rect x="705" y="180" width="50" height="35" fill="#2EC4B6" rx="3" opacity="0.7"/>

  <rect x="320" y="220" width="50" height="35" fill="#F4A261" rx="3" opacity="0.7"/>
  <rect x="375" y="220" width="50" height="35" fill="#E63946" rx="3" opacity="0.8"/>
  <rect x="430" y="220" width="50" height="35" fill="#2EC4B6" rx="3" opacity="0.5"/>
  <rect x="485" y="220" width="50" height="35" fill="#2EC4B6" rx="3" opacity="0.8"/>
  <rect x="540" y="220" width="50" height="35" fill="#F4A261" rx="3" opacity="0.9"/>
  <rect x="595" y="220" width="50" height="35" fill="#E63946" rx="3" opacity="0.6"/>
  <rect x="650" y="220" width="50" height="35" fill="#2EC4B6" rx="3" opacity="0.3"/>
  <rect x="705" y="220" width="50" height="35" fill="#F4A261" rx="3" opacity="0.8"/>

  <rect x="320" y="260" width="50" height="35" fill="#2EC4B6" rx="3" opacity="0.3"/>
  <rect x="375" y="260" width="50" height="35" fill="#2EC4B6" rx="3" opacity="0.5"/>
  <rect x="430" y="260" width="50" height="35" fill="#E63946" rx="3" opacity="0.9"/>
  <rect x="485" y="260" width="50" height="35" fill="#F4A261" rx="3" opacity="0.6"/>
  <rect x="540" y="260" width="50" height="35" fill="#2EC4B6" rx="3" opacity="0.7"/>
  <rect x="595" y="260" width="50" height="35" fill="#2EC4B6" rx="3" opacity="0.9"/>
  <rect x="650" y="260" width="50" height="35" fill="#F4A261" rx="3" opacity="0.4"/>
  <rect x="705" y="260" width="50" height="35" fill="#E63946" rx="3" opacity="0.7"/>

  <!-- Footer text -->
  <text x="562" y="440" font-family="sans-serif" font-size="11" fill="#999" text-anchor="middle">Launch: aedm dashboard --input roles.csv</text>
</svg>
