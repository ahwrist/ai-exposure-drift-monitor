[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aedm"
version = "0.1.0"
description = "AI Exposure Drift Monitor — Operationalizes Anthropic's AI labor market exposure framework into a workforce planning tool."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Andrew Wrist" },
]
keywords = ["ai", "workforce", "exposure", "automation", "labor-market", "analytics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "structlog>=23.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "plotly>=5.15",
    "matplotlib>=3.7",
    "thefuzz[speedup]>=0.20",
    "streamlit>=1.28",
    "markdown>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.5",
    "pandas-stubs>=2.0",
]

[project.scripts]
aedm = "aedm.cli:app"

[project.urls]
Homepage = "https://github.com/ahwrist/ai-exposure-drift-monitor"
Repository = "https://github.com/ahwrist/ai-exposure-drift-monitor"
Documentation = "https://github.com/ahwrist/ai-exposure-drift-monitor/tree/main/docs"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["aedm"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["src/aedm"]
